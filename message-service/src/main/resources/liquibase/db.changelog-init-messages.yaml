databaseChangeLog:
  - changeSet:
      id: 1
      author: ykalapusha
      changes:
        - createTable:
            tableName: messages
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: conversation_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: sender_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: client_message_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: text
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                    name: created_at
                    type: TIMESTAMP
                    constraints:
                        nullable: false

        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: conversation_id
            referencedTableName: conversations
            referencedColumnNames: id
            constraintName: fk_messages_conversations

        - addUniqueConstraint:
            tableName: messages
            columnNames: sender_id, client_message_id
            constraintName: uq_messages_sender_id_client_message_id

        - createIndex:
            tableName: messages
            indexName: idx_conversation_id_created_at_desc
            columns:
              - column:
                  name: conversation_id
              - column:
                  name: created_at
                  descending: true

        - createIndex:
            tableName: messages
            indexName: idx_sender_id_created_at_desc
            columns:
              - column:
                  name: sender_id
              - column:
                  name: created_at
                  descending: true